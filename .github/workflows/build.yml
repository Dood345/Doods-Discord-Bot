name: Build Verification

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv + Python 3.14
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: uv sync

    - name: Verify Code Compilation
      run: uv run python -m compileall -q . -x '\.venv'

    - name: Lint (undefined names, unused imports, syntax)
      run: uv run ruff check .

    - name: Run tests
      run: uv run pytest -q

    - name: Privacy guard (no hardcoded Discord IDs / LAN IPs)
      run: |
        if git grep -nE '\b[0-9]{17,20}\b|\b192\.168\.[0-9]+\.[0-9]+\b' -- . ':!uv.lock' ':!*.example.json'; then
          echo "::error::Hardcoded Discord ID or LAN IP found. Move it to .env or data/server_contexts.json."
          exit 1
        fi
