[project]
name = "doodlab-bot"
version = "0.1.0"
description = "Aperture Science Mainframe Discord Bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py[voice]==2.7.1",  # release with DAVE voice + Python 3.14 fixes; was @master
    "davey",
    "python-dotenv==1.0.0",
    "Flask==3.0.0",
    "PyNaCl",
    "aiohttp",
    "qrcode[pil]",
    "ping3",
    "websocket-client",
    "requests",
    "yt-dlp[default]",
    "bgutil-ytdlp-pot-provider",
    "deno",
    "edge-tts",
    "aiosqlite",
    "tzdata>=2026.5",
    "pillow>=12.1.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "ruff>=0.17.1",
]

[tool.ruff]
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# Bug-catching rules only (undefined names, unused imports/variables, redefinitions, syntax).
# No formatter: the repo mixes CRLF and LF, and a reformat would touch every file.
select = ["F", "E9"]
